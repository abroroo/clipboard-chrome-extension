<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cliply</title>
</head>
<body>
  <header class="head">
    <img src="../icons/icon24.png" width="24" height="24" alt="" />
    <div>
      <div class="name">Cliply</div>
      <div class="sub"><span id="count">0</span> clips · synced across your devices</div>
    </div>
  </header>

  <section>
    <h2>Shortcut</h2>
    <p class="row">Toggle the panel with <kbd id="shortcut">Alt+C</kbd> <a href="#" id="shortcuts-link">change</a></p>
  </section>

  <section>
    <h2>Hidden on these sites</h2>
    <ul id="hidden-list" class="list"></ul>
    <p id="hidden-empty" class="muted">None. Use the ⋯ menu in the panel to hide Cliply on a site.</p>
  </section>

  <section>
    <h2>Backup</h2>
    <div class="btns">
      <button id="export">Export JSON</button>
      <button id="import">Import JSON</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
    </div>
    <p id="status" class="muted" role="status"></p>
  </section>
</body>
</html>
